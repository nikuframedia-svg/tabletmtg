.user-btn{display:flex;align-items:center;gap:8px;text-align:left;margin-left:auto;background:transparent;border-color:transparent!important}
.user-btn .who-mini{flex:0 1 auto}
.menu{position:absolute;right:clamp(10px,2.5vw,20px);top:calc(100% + 4px);z-index:8;min-width:250px;background:var(--p);border:1px solid var(--ln);border-radius:12px;box-shadow:0 10px 28px #0008;padding:6px;display:flex;flex-direction:column;gap:4px}
.menu button{text-align:left;min-height:48px!important;font-size:15px!important;border:0!important;background:transparent}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu .menu-row{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:14px;color:var(--mu)}
.menu .menu-row select{flex:1}
.menu hr{border:0;border-top:1px solid var(--ln);margin:2px 0;width:100%}
.of-card[hidden]{display:none!important}
.planning-list .formats{grid-template-columns:repeat(6,minmax(0,1fr))}
.planning-list .formats button{padding-inline:4px;font-size:15px}
.search{display:flex;gap:8px;align-items:center}
.search input{height:46px;font-size:18px}
.search button{min-height:46px;padding:6px 14px}
.pri{display:inline-block;min-width:34px;text-align:center;padding:1px 6px;border-radius:6px;background:var(--red);color:#fff;font-size:13px;font-weight:800}
.pri-col{flex:0 0 56px;align-self:stretch;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--red);color:#fff;font-size:20px;font-weight:800;margin:-1px 0}
.pri-col.none{background:transparent;color:var(--mu);border:1px dashed var(--ln);font-size:16px}
.pri.none{background:transparent;color:var(--mu);border:1px solid var(--ln)}
.planning-list .description{font-size:18px;font-weight:800;color:var(--ink);white-space:normal;line-height:1.2}
.of-form .entry-field input{width:80px}
.of-form-fields .static{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}.of-form-fields .static b{font-size:17px;color:var(--ink);line-height:44px}
.fin-note{font-size:14px;font-weight:700}.fin-note.disc{color:var(--amb)}.fin-note.part{color:var(--grn)}
.of-card.partial{border-color:var(--grn);border-style:dashed}
.kb-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kb-filters .seg{display:flex;gap:4px}.kb-filters .seg button{min-height:44px;padding:6px 12px;font-size:14px}
.kb-summary{grid-template-columns:repeat(5,minmax(0,1fr))}
.kb-table-wrap{overflow-x:auto;border:1px solid var(--ln);border-radius:10px;-webkit-overflow-scrolling:touch}
.kb-table{border-collapse:collapse;width:100%;min-width:720px;font-size:12px}
.kb-table th{position:sticky;top:0;background:var(--th);color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:.2px;text-align:left;padding:6px 5px;border-bottom:1px solid var(--ln);white-space:nowrap}
.kb-table td{padding:6px 5px;border-bottom:1px solid var(--ln);vertical-align:top}
.kb-table tr.live td{background:var(--live)}
.kb-table td.num{text-align:right;white-space:nowrap}
.kb-table td.model{font-weight:700;min-width:120px}.kb-table td.nw{white-space:nowrap}
.kb-table .stops{min-width:96px}.kb-table .stops div{font-size:11px;line-height:1.25}.kb-table .stops b{margin-left:4px}
.kb-table tfoot td{font-weight:800;background:var(--th)}
:root{--hover:#ffffff10;--th:#1d2328;--live:#16261e}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f4f6;--p:#ffffff;--ln:#cfd5db;--ink:#14181c;--mu:#56616b;--amb:#c77c00;--grn:#13864b;--red:#c52f37;--hover:#0000000b;--th:#eceff2;--live:#e6f5ec}
:root[data-theme="light"] .run-bar{background:#e8f5ee}
:root[data-theme="light"] .run-bar.paused{background:#fff4df}
:root[data-theme="light"] .reason-panel{background:#ffffff}
:root[data-theme="light"] .of-card.sel,:root[data-theme="light"] .of.sel{background:#fff6e5}
:root[data-theme="light"] .av{background:#e2e6ea}
:root[data-theme="light"] .badge{background:#e2e6ea}
:root[data-theme="light"] .ov{background:#0f121599}
:root[data-theme="light"] .warn-box,:root[data-theme="light"] .kb-stop,:root[data-theme="light"] .stop-summary{background:#fff4df}
:root[data-theme="light"] .kb-summary div{background:#fff6e5}
:root[data-theme="light"] .of-form{background:#f6f7f9}
:root[data-theme="light"] .count{background:#0000001a}
:root[data-theme="light"] .fixed-top{box-shadow:0 4px 12px #0002}
:root[data-theme="light"] .menu{box-shadow:0 10px 28px #0003}
:root[data-theme="light"] button.on,:root[data-theme="light"] .a{color:#fff}
:root[data-theme="light"] .bar-of{border-top-color:#0000001a}
@media(max-width:720px){.planning-list .formats{grid-template-columns:repeat(3,minmax(0,1fr))}.hdr .machine{font-size:14px}.user-btn .who-mini small{display:none}}

      const segments=state.log.slice(last+1).filter(log=>["prod","stop"].includes(log.t)&&log.of===r.ids.join("+")&&logUser(log)===state.uid);
      r.prodMs=segments.filter(l=>l.t==="prod").reduce((n,l)=>n+l.sec*1000,0);

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(error){toast(t().storageError);}}
const scheduleText = schedule => schedule?`${hm(schedule.start)}–${hm(schedule.end)}${schedule.end<schedule.start?` · ${t().nextDay}`:""}`:t().unknownSchedule;
const reasonText = record => Number.isInteger(record.reasonId)?t().rs[record.reasonId]:(record.why||record.reason||t().pendingReason);
const shortStamp = value => value==null||!Number.isFinite(value)?"—":new Date(value).toLocaleString(locale(),{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function dayBounds(date=localDay()) {const [y,m,d]=date.split("-").map(Number);return [new Date(y,m-1,d).getTime(),new Date(y,m-1,d+1).getTime()];}
const overlapMs=(start,end,bounds)=>Math.max(0,Math.min(end,bounds[1])-Math.max(start,bounds[0]));
function totals(now=Date.now()){
  if(!S.run)return {p:0,s:0,total:0};
  const r=S.run,elapsed=Math.max(0,now-r.since),p=(r.prodMs+(r.phase==="prod"?elapsed:0))/1000,s=(r.stopMs+(r.phase==="stop"?elapsed:0))/1000;
  return {p,s,total:p+s};
}
function stats(now=Date.now()){
  const bounds=dayBounds(localDay(now));let p=0,s=0,n=0;
  for(const log of S.log){if(logUser(log)!==S.uid)continue;
    if(log.t==="pcs"){if(localDay(Date.parse(log.at))===localDay(now))n+=log.n;continue;}
    if(log.startedAt==null||log.endedAt==null)continue;
    const sec=overlapMs(log.startedAt,log.endedAt,bounds)/1000;
    if(log.t==="prod")p+=sec;if(log.t==="stop")s+=sec;
  }
  if(S.run&&S.run.context.uid===S.uid){const elapsed=overlapMs(S.run.since,now,bounds)/1000;if(S.run.phase==="prod")p+=elapsed;else s+=elapsed;n+=S.run.ids.reduce((sum,id)=>sum+Math.max(0,ofBy(id).made-runBase(id)),0);}
  return {p,s,total:p+s,n};
}

/* ---------- Kanban: every order this worker produced, with its times and stops ---------- */
function runSegments(runId,now){
  const segments=runId?S.log.filter(l=>l.runId===runId&&(l.t==="prod"||l.t==="stop")&&l.startedAt!=null).map(l=>({...l,ongoing:false})):[];
  if(S.run&&S.run.id===runId)segments.push({id:`active-${S.run.id}`,t:S.run.phase,startedAt:S.run.since,endedAt:null,reasonId:S.run.reasonId,why:S.run.reason,ongoing:true});
  return segments;
}
function shiftWindow(date,shift){const [y,m,d]=date.split("-").map(Number),sh=SHIFTS[shift],start=new Date(y,m-1,d).getTime()+sh.start*60000;let end=new Date(y,m-1,d).getTime()+sh.end*60000;if(end<=start)end+=86400000;return [start,end];}
function previousShift(now=new Date()){
  const h=now.getHours(),day=n=>localDay(now.getTime()+n*86400000);
  if(h>=7&&h<15)return {date:day(-1),shift:"N"};
  if(h>=15&&h<23)return {date:day(0),shift:"M"};
  return {date:h>=23?day(0):day(-1),shift:"T"};
}
function kanbanRows(now=Date.now()){
  const rows=S.log.filter(l=>l.t==="pcs"&&logUser(l)===S.uid).map((l,i)=>({key:l.id||`pcs-${i}`,of:l.of,runId:l.runId,made:l.n,discard:l.discard||0,shift:l.shift,endAt:Date.parse(l.at),live:false}));
  if(S.run&&S.run.context.uid===S.uid)S.run.ids.forEach(id=>rows.push({key:`live-${id}`,of:id,runId:S.run.id,made:Math.max(0,(ofBy(id)?.made||0)-runBase(id)),discard:0,shift:S.run.context.shift,endAt:null,live:true}));
  const {date,shift}=S.filters,win=date&&SHIFTS[shift]?shiftWindow(date,shift):date?dayBounds(date):null;
  return rows.map(row=>{
    const segments=runSegments(row.runId,now);let p=0,s=0;
    for(const g of segments){const d=Math.max(0,(g.endedAt??now)-g.startedAt)/1000;if(g.t==="prod")p+=d;else s+=d;}
    const startAt=segments.length?Math.min(...segments.map(g=>g.startedAt)):row.endAt;
    return {...row,p,s,startAt,stops:segments.filter(g=>g.t==="stop").sort((a,b)=>a.startedAt-b.startedAt)};
  }).filter(r=>{const st=r.startAt??now,en=r.endAt??now;
      if(win)return overlapMs(st,Math.max(en,st+1),win)>0;
      if(SHIFTS[shift])return r.shift===shift;
      return true;})
    .sort((a,b)=>(a.startAt??now)-(b.startAt??now));
}
function kanbanBody(now=Date.now()){
  const x=t(),k=x.k,user=me(),rows=kanbanRows(now),seen=new Set();let p=0,s=0,n=0;
  for(const r of rows){n+=r.made||0;const key=r.runId||r.key;if(seen.has(key))continue;seen.add(key);p+=r.p;s+=r.s;}
  const summary=[[x.operatorName,esc(user[1])],[x.operatorNo,esc(user[3])],[x.qtyProduced,n],[x.prodTime,hms(p)],[x.stopTime,hms(s)]];
  const time=v=>v==null?"—":new Date(v).toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"});
  const body=rows.map(r=>{
    const o=ofBy(r.of)||{of:r.of,client:"",desc:"",plan:"—"};
    const stops=r.stops.map(g=>`<div>${esc(reasonText(g))}<b>${hms(Math.max(0,(g.endedAt??now)-g.startedAt)/1000)}</b></div>`).join("")||"—";
    return `<tr class="${r.live?"live":""}"><td>${o.pri?`<span class="pri">${esc(o.pri)}</span>`:"—"}</td><td>${esc(o.client)}</td><td><b>${esc(r.of)}</b></td><td class="model">${esc(o.desc)}</td><td class="num"><b>${r.made}</b>/${o.plan}${r.discard?`<br><small class="mu">−${r.discard}</small>`:""}</td><td class="num">${esc(o.comp??"—")}</td><td class="nw">${esc(fmtName(o))}</td><td class="num">${esc(o.esp??"—")}</td><td class="num">${esc(o.lb??"—")}</td><td class="num">${esc(o.lt??"—")}</td><td class="num">${time(r.startAt)}</td><td class="num">${r.live?"●":time(r.endAt)}</td><td class="num">${hms(r.p)}</td><td class="stops">${stops}</td></tr>`;
  }).join("");
  const head=["pri","client","of","model","qty","comp","coni","esp","lb","lt","start","end","prod","stops"].map(c=>`<th>${k[c]}</th>`).join("");
  const table=rows.length?`<div class="kb-table-wrap"><table class="kb-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot><tr><td colspan="4">${x.total}</td><td class="num">${n}</td><td colspan="7"></td><td class="num">${hms(p)}</td><td>${hms(s)}</td></tr></tfoot></table></div>`:`<div class="empty">${x.noKanban}</div>`;
  return `<dl class="kb-summary">${summary.map(([key,v])=>`<div><dt>${key}</dt><dd>${v}</dd></div>`).join("")}</dl>${table}`;
}
function vKanban(){
  const x=t(),user=me(),f=S.filters,prev=previousShift();
  const shiftBtns=[["",x.allShifts],...Object.keys(SHIFTS).map(id=>[id,x[id]])].map(([id,label])=>`<button class="${(f.shift||"")===id?"on":""}" data-a="kbShift" data-v="${id}">${label}</button>`).join("");
  return `<div class="kb-top"><h2>${x.kanban} · ${esc(user[1])}</h2><input id="filter-date" type="date" value="${esc(f.date)}" aria-label="${x.date}"><button class="${f.date===localDay()&&!f.shift?"on":""}" data-a="kbDate" data-v="today">${x.todayBtn}</button><button class="${f.date===prev.date&&f.shift===prev.shift?"on":""}" data-a="kbPrev">${x.prevShift}</button><button class="${!f.date?"on":""}" data-a="kbDate" data-v="all">${x.allDatesBtn}</button></div>
    <div class="kb-filters"><span class="mu">${x.shiftLabel}</span><div class="seg">${shiftBtns}</div></div>

function runLive(now=Date.now()){
  const x=t(),r=S.run,segments=runSegments(r.id,now);let p=0,s=0;
  for(const g of segments){const d=Math.max(0,(g.endedAt??now)-g.startedAt)/1000;if(g.t==="prod")p+=d;else s+=d;}

    <div class="kb-stops"><span class="kb-label">${x.stopsOf} (${stops.length})</span>${stops.map(g=>`<div class="kb-stop ${g.ongoing?"ongoing":""}"><b>${esc(reasonText(g))}</b><span>${shortStamp(g.startedAt)} → ${g.ongoing?x.inProgress:shortStamp(g.endedAt)}</span><b>${hms(Math.max(0,(g.endedAt??now)-g.startedAt)/1000)}</b></div>`).join("")||`<span class="mu kb-none">${x.noStopsOf}</span>`}</div>`;
}

function ofForm(prefix){
  const x=t();
  return `<div class="of-forms">${S.run.ids.map(id=>{const o=ofBy(id),key=esc(id);return `<div class="of-form">
    <div class="of-form-head">${priTag(o)}<b>OF ${key}</b><span>${esc(o.client)} — ${esc(o.desc)}</span></div>
    <div class="of-form-fields">
      <label for="${prefix}-${key}">${x.qtyProduced}<span class="entry-field"><input id="${prefix}-${key}" type="number" inputmode="numeric" enterkeyhint="done" min="0" step="1" value="${o.made}" data-quantity="${key}"><span>/ ${o.plan}</span></span></label>
      <button class="a" data-a="full" data-v="${key}" aria-label="OF ${key} · ${x.fullQuantity}">100%</button>
      <span class="static">${x.nextMachine}<b>${esc(o.dest||NEXT_MACHINE)}</b></span>
    </div>${prefix==="fq"?finNote(o):""}</div>`;}).join("")}</div>`;
}
function reasonPanel(){if(!S.stopPanel||S.run?.phase!=="stop")return "";const x=t();return `<section class="reason-panel" id="reason-panel" aria-labelledby="reason-title"><div class="reason-inner"><div class="section-title"><h2 id="reason-title">${x.why}</h2><button data-a="hideReason">${x.closePanel}</button></div>${ofForm("pq")}<div class="reasons">${x.rs.map((reason,i)=>`<button data-a="why" data-v="${i}" class="${S.run.reasonId===i?"on":""}">${reason}</button>`).join("")}</div></div></section>`;}
function modal(){const x=t();
  if(S.modal==="fin"&&S.run)return `<div class="ov"><section class="md" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">${x.fin}</h2>${ofForm("fq")}<div class="two"><button data-a="close">${x.cancel}</button><button class="r" data-a="done">${x.yes}</button></div></section></div>`;
  if(S.modal==="again"&&!S.run)return `<div class="ov"><section class="md" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">OF ${esc(S.rid)}</h2><p>${x.again}</p><div class="two"><button data-a="close">${x.cancel}</button><button class="a" data-a="recut">${x.againY}</button></div></section></div>`;
  if(S.modal==="machineStop"&&S.run?.phase==="stop"){const r=S.run;return `<div class="ov"><section class="md warn" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">⚠ ${x.machineStopTitle}</h2><p>${x.machineStopText}</p><dl class="warn-box"><div><dt>${x.reason}</dt><dd>${esc(reasonText(r))}</dd></div><div><dt>OF</dt><dd>${r.ids.map(esc).join(" + ")}</dd></div><div><dt>${x.since}</dt><dd>${shortStamp(r.since)}</dd></div><div><dt>${x.duration}</dt><dd id="warn-dur">${hms((Date.now()-r.since)/1000)}</dd></div><div><dt>${x.by}</dt><dd>${esc(r.context.userName)}</dd></div></dl><div class="two"><button data-a="close">${x.close}</button><button class="g" data-a="resumeWarn">▶ ${x.resumeNow}</button></div></section></div>`;}
  return "";
}
function syncInsets(){document.documentElement.style.setProperty("--reason-h",`${$("reason-panel")?.getBoundingClientRect().height||0}px`);}
const resizeObserver=new ResizeObserver(syncInsets);
function render(resetScroll=false){
  const previous=document.activeElement,focusId=previous?.id,action=previous?.dataset?.a,value=previous?.dataset?.v,y=resetScroll?0:scrollY;
  document.documentElement.lang=S.lang;document.documentElement.dataset.theme=S.theme;document.querySelector('meta[name="theme-color"]')?.setAttribute("content",S.theme==="light"?"#f3f4f6":"#0f1215");
  const showDock=S.screen==="main"&&S.page==="plan"&&!S.run&&S.sel.length;
  const view=S.screen==="who"?vWho():S.screen==="schedules"?vSchedules():S.page==="kanban"?vKanban():vList();
  $("app").innerHTML=`<div class="fixed-top" id="fixed-top">${topBar()}${runBar()}</div><main class="w ${showDock?"has-dock":""}">${view}</main>`+(showDock?`<div class="dock"><button class="g" data-a="start">▶ ${S.sel.length===2?t().start2:t().start}</button></div>`:"")+reasonPanel();
  $("ov").innerHTML=modal();$("app").inert=!!S.modal;
  resizeObserver.disconnect();if($("reason-panel"))resizeObserver.observe($("reason-panel"));syncInsets();
  if(S.modal){const md=document.querySelector(".md");if(!md?.contains(previous)||!previous.id)md?.querySelector(".two button")?.focus({preventScroll:true});else $(focusId)?.focus({preventScroll:true});}
  else if(!resetScroll){const next=focusId?$(focusId):Array.from(document.querySelectorAll("[data-a]")).find(b=>b.dataset.a===action&&b.dataset.v===value);next?.focus({preventScroll:true});}
  scrollTo(0,y);save();
}
function tick(){const now=Date.now(),z=totals(now);for(const [id,value] of [["clock-total",z.total],["clock-prod",z.p],["clock-stop",z.s]])if($(id))$(id).textContent=hms(value);
  if($("foot")){const daily=stats(now);document.querySelectorAll("[data-stat]").forEach(el=>el.textContent=el.dataset.stat==="n"?daily.n:hms(daily[el.dataset.stat]));}
  if($("kanban-body")&&S.run)$("kanban-body").innerHTML=kanbanBody(now);
  if($("run-live")&&S.run)$("run-live").innerHTML=runLive(now);
  if($("warn-dur")&&S.run)$("warn-dur").textContent=hms((now-S.run.since)/1000);
}
function closeSegment(now=Date.now()){
  const r=S.run,elapsed=Math.max(0,now-r.since);
  S.log.push({...r.context,id:uid(),runId:r.id,k:r.context.uid+"|"+localDay(r.since),t:r.phase,sec:elapsed/1000,why:r.reason||null,reasonId:r.reasonId,of:r.ids.join("+"),at:new Date(r.since).toISOString(),startedAt:r.since,endedAt:now});
  if(r.phase==="prod")r.prodMs+=elapsed;else r.stopMs+=elapsed;r.since=now;
}
function addSelection(id){const o=ofBy(id);if(!o||!["todo","partial"].includes(o.state))return;const i=S.sel.indexOf(id);if(i>=0){S.sel.splice(i,1);return;}if(S.sel.length>=2)return toast(t().max);if(S.sel.length&&sheet(ofBy(S.sel[0]))!==sheet(o))return toast(t().diff);S.sel.push(id);}
const A={
  lang:value=>{if(T[value])S.lang=value;},
  user:value=>{if(S.run||S.screen!=="who")return;const user=USERS.find(u=>u[0]===value);if(!user)return;S.uid=value;
    const now=shiftNow(),schedule=S.schedules[value];if(schedule.shift!==now)S.schedules[value]={...SHIFTS[now],shift:now};
    S.screen="schedules";S.page="plan";S.fmt="all";S.tab="todo";S.sel=[];S.filters={date:localDay(),user:""};editingQuantity=null;},
  shift:value=>{if(S.screen!=="schedules"||!SHIFTS[value]||!me())return;S.schedules[S.uid]={...SHIFTS[value],shift:value};},
  schedules:()=>{if(S.screen==="main"&&me())S.screen="schedules";},
  validate:()=>{if(S.screen==="schedules"&&me())S.screen="main";},
  adjust:value=>{const [user,field,delta]=value.split(":");if(S.screen!=="schedules"||user!==me()?.[0]||!["start","end"].includes(field)||![-30,30].includes(+delta))return;const schedule=S.schedules[user],next=(schedule[field]+(+delta)+1440)%1440;if(next===schedule[field==="start"?"end":"start"])return toast(t().equalTime);schedule[field]=next;},
  out:()=>{if(S.run)return toast(t().busy);showWorkerSelection();},
  menu:()=>{S.menu=!S.menu;},
  theme:()=>{S.theme=S.theme==="light"?"dark":"light";},
  fullscreen:()=>{const el=document.documentElement;try{if(isFullscreen())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else{const req=el.requestFullscreen||el.webkitRequestFullscreen;const pr=req.call(el,{navigationUI:"hide"});pr?.catch?.(()=>{});}}catch(e){}},
  clearSearch:()=>{S.q="";},
  kbShift:value=>{S.filters.shift=SHIFTS[value]?value:"";if(S.filters.shift&&!S.filters.date)S.filters.date=localDay();},
  kbPrev:()=>{const p=previousShift();S.filters.date=p.date;S.filters.shift=p.shift;},
  page:value=>{if(["plan","kanban"].includes(value))S.page=value;},
  fmt:value=>{if(value==="all"||FMT.some(f=>f[0]===value)){S.fmt=value;S.sel=[];editingQuantity=null;}},
  tab:value=>{if(["todo","run","done"].includes(value)){S.tab=value;S.sel=[];}},
  of:value=>{const o=ofBy(value);if(!o)return;
    if(S.run){if(S.run.phase==="stop"){S.modal="machineStop";S.rid=value;return;}return toast(t().runFirst);}
    if(o.state==="done"){S.modal="again";S.rid=value;}else addSelection(value);},
  recut:()=>{if(S.run||S.modal!=="again")return;const o=ofBy(S.rid);if(!o)return;Object.assign(o,{state:"todo",recut:true,made:0});S.tab="todo";S.modal=null;S.sel=[o.of];S.rid=null;},
  start:()=>{if(S.run||!S.sel.length||S.sel.length>2||S.sel.some(id=>!["todo","partial"].includes(ofBy(id)?.state)))return;if(S.sel.length===2&&sheet(ofBy(S.sel[0]))!==sheet(ofBy(S.sel[1])))return;const now=Date.now(),user=me(),schedule=S.schedules[S.uid];S.run={id:uid(),ids:[...S.sel],phase:"prod",since:now,startedAt:now,prodMs:0,stopMs:0,reasonId:null,reason:null,base:Object.fromEntries(S.sel.map(id=>[id,ofBy(id).made||0])),context:{uid:S.uid,userName:user[1],operatorNo:user[3],shift:schedule.shift,schedule:{start:schedule.start,end:schedule.end},orders:orderSnapshot(S.sel,S.ofs)}};S.sel.forEach(id=>ofBy(id).state="run");S.sel=[];S.tab="run";},
  stop:()=>{if(S.run?.phase!=="prod")return;closeSegment();Object.assign(S.run,{phase:"stop",reasonId:null,reason:null});S.stopPanel=true;},
  why:value=>{if(S.run?.phase!=="stop"||!Number.isInteger(+value)||!t().rs[+value])return;S.run.reasonId=+value;S.run.reason=null;S.stopPanel=false;},
  reasonPanel:()=>{if(S.run?.phase==="stop")S.stopPanel=!S.stopPanel;},hideReason:()=>S.stopPanel=false,
  resume:()=>{if(S.run?.phase!=="stop")return;closeSegment();Object.assign(S.run,{phase:"prod",reasonId:null,reason:null});S.stopPanel=false;},
  resumeWarn:()=>{A.resume();S.modal=null;S.rid=null;},
  details:value=>{if(ofBy(value))S.expandedOf=S.expandedOf===value?null:value;},
  editQuantity:value=>{if(listEditable(ofBy(value)))editingQuantity=value;},
  full:value=>{const order=ofBy(value);if(canEditQuantity(order))order.made=order.plan;},
  fin:()=>{if(S.run)S.modal="fin";},close:()=>{S.modal=null;S.rid=null;},
  done:()=>{if(!S.run||S.modal!=="fin")return;const now=Date.now();closeSegment(now);const r=S.run,notes=[];let anyPartial=false;
    r.ids.forEach(id=>{const o=ofBy(id),missing=Math.max(0,o.plan-o.made),produced=Math.max(0,o.made-(r.base?.[id]??0));
      let discard=0;
      // Only a 100% complete order is "Feita"; anything short stays "Em curso".
      if(missing>0){o.state="partial";anyPartial=true;notes.push(fill(t().partialToast,{of:o.of,n:missing}));}
      else o.state="done";
      S.log.push({...r.context,id:uid(),runId:r.id,k:r.context.uid+"|"+localDay(now),t:"pcs",n:produced,total:o.made,plan:o.plan,discard,partial:o.state==="partial",dest:o.dest||NEXT_MACHINE,of:o.of,at:new Date(now).toISOString()});});
    S.run=null;S.modal=null;S.stopPanel=false;S.tab=anyPartial?"run":"done";if(notes.length)setTimeout(()=>toast(notes.join(" ")),0);},
  kbDate:value=>{S.filters.date=value==="today"?localDay():"";S.filters.shift="";},
  resetFilters:()=>S.filters={date:"",user:""}
};
document.addEventListener("click",event=>{const button=event.target.closest("[data-a]");
  if(S.menu&&!event.target.closest(".menu")&&button?.dataset.a!=="menu"){S.menu=false;if(!button){render();return;}}
  if(!button||button.disabled)return;const action=A[button.dataset.a];if(action){
  if(button.closest(".menu"))S.menu=false;
  action(button.dataset.v);
  render(["page","user","schedules","validate","out"].includes(button.dataset.a));
  if(button.dataset.a==="editQuantity"){
    const input=$("quantity-"+editingQuantity);
    input?.focus();
    input?.select();
  }
}});
function updateQuantity(input,final=false){
  const order=ofBy(input.dataset.quantity);if(!canEditQuantity(order))return;
  const number=Number(input.value),valid=input.value.trim()!==""&&input.validity.valid&&Number.isSafeInteger(number)&&number>=0;
  if(valid){
    order.made=number;
    document.querySelectorAll(`[data-piece-count="${CSS.escape(order.of)}"]`).forEach(el=>el.textContent=number>0||el.classList.contains("kb-qty")?`${number}/${order.plan}`:order.plan);
    document.querySelectorAll(`[data-quantity="${CSS.escape(order.of)}"]`).forEach(other=>{if(other!==input)other.value=String(number);});
    save();tick();
    if(final){input.value=String(number);if(S.modal==="fin")render();}
  }
  else if(final){input.value=order.made;toast(t().invalidQuantity);}
}
document.addEventListener("input",event=>{const target=event.target;if(target.matches("[data-quantity]"))updateQuantity(target);
  if(target.id==="of-search"){S.q=target.value.replace(/\D/g,"");document.querySelectorAll(".planning-list .of-card[data-of]").forEach(card=>card.hidden=!matchesQuery({of:card.dataset.of}));save();}});
// Enter on a quantity or search field confirms the value and closes the on-screen keyboard.
document.addEventListener("keydown",event=>{const target=event.target;if(event.key!=="Enter"||!target.matches?.("input"))return;
  if(target.matches("[data-quantity]")){event.preventDefault();updateQuantity(target,true);target.blur();}
  else if(target.id==="of-search"){event.preventDefault();target.blur();}});
document.addEventListener("fullscreenchange",()=>render());
// Self-update: when a newer version is served, reload (state lives in localStorage, so nothing is lost).
async function checkVersion(){if(S.modal||document.activeElement?.matches?.("input"))return;try{const res=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});const html=await res.text();const m=/const APP_VERSION="([^"]+)"/.exec(html);if(m&&m[1]!==APP_VERSION)location.reload();}catch(e){}}
setInterval(checkVersion,120000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkVersion();});
document.addEventListener("change",event=>{const target=event.target;
  if(target.matches("[data-quantity]"))updateQuantity(target,true);
  if(target.id==="of-search"){S.q=target.value.replace(/\D/g,"");render();}
  if(target.id==="filter-date"){S.filters.date=target.value;render();}
  if(target.id==="lang-select"&&T[target.value]){S.lang=target.value;render();}
});
document.addEventListener("keydown",event=>{if(event.key==="Escape"){if(S.modal){A.close();render();}else if(S.stopPanel){S.stopPanel=false;render();}}if(event.key==="Tab"&&S.modal){const buttons=Array.from(document.querySelectorAll(".md button"));if(event.shiftKey&&document.activeElement===buttons[0]){event.preventDefault();buttons.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===buttons.at(-1)){event.preventDefault();buttons[0].focus();}}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick();});
window.addEventListener("resize",syncInsets);
setInterval(tick,1000);
render();
if(initialStorageError)toast(t().storageError);

}
</script>
</body>
